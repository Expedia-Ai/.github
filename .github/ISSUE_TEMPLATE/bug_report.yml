name: "🐛 Bug report"
description: "Report a defect to help us improve"
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: "markdown"
    attributes:
      value: |
        Thanks for filing a clear, reproducible bug report.
  - type: "checkboxes"
    id: "preflight"
    attributes:
      label: "Pre-flight checks"
      options:
        - label: "I searched existing issues and discussions for duplicates."
          required: true
        - label: "I am running the latest released version (or `main`)."
          required: true
        - label: "I agree to follow the project's Code of Conduct."
          required: true
  - type: "textarea"
    id: "summary"
    attributes:
      label: "Summary"
      description: "One-paragraph summary of the bug."
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: "textarea"
    id: "actual"
    attributes:
      label: "Actual behavior"
      description: "Include error messages, stack traces, or screenshots."
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true
  - type: "input"
    id: "repro"
    attributes:
      label: "Minimal reproduction"
      description: "Public link to a runnable repro (StackBlitz, CodeSandbox, repo, gist). Strongly preferred."
  - type: "dropdown"
    id: "severity"
    attributes:
      label: "Severity"
      options:
        - "S0 — production outage / data loss"
        - "S1 — broken core path, no workaround"
        - "S2 — broken non-core path, workaround exists"
        - "S3 — minor / cosmetic"
    validations:
      required: true
  - type: "input"
    id: "version"
    attributes:
      label: "Version"
      description: "Package version, commit SHA, or release tag."
    validations:
      required: true
  - type: "checkboxes"
    id: "os"
    attributes:
      label: "Operating systems"
      options:
        - label: "macOS"
        - label: "Windows"
        - label: "Linux"
        - label: "iOS"
        - label: "Android"
        - label: "Other (describe in environment)"
  - type: "dropdown"
    id: "browser"
    attributes:
      multiple: true
      label: "Browsers (if applicable)"
      options:
        - "Not browser-related"
        - "Chrome / Chromium"
        - "Firefox"
        - "Safari"
        - "Edge"
        - "Arc"
        - "Brave"
        - "Mobile Safari"
        - "Mobile Chrome"
        - "Other (describe in environment)"
  - type: "input"
    id: "environment"
    attributes:
      label: "Environment / runtime"
      description: "Node version, Python version, OS version, branch, deployment target, etc."
  - type: "textarea"
    id: "logs"
    attributes:
      label: "Relevant logs or output"
      render: "shell"
  - type: "textarea"
    id: "context"
    attributes:
      label: "Additional context"
      description: "Anything else worth sharing — screenshots, telemetry, related issues."
